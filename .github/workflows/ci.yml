name: CI

on:
  push:
    branches:
      - feat/overseas-community-platform-bootstrap
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tools/ci/run-and-report.sh "Install JavaScript dependencies" pnpm install --no-frozen-lockfile
          else
            tools/ci/run-and-report.sh "Install JavaScript dependencies" pnpm install --frozen-lockfile
          fi

      - name: Persist generated lockfile
        if: github.event_name == 'push'
        run: |
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh dependency lockfile [skip ci]"
            git push
          fi

      - name: Restore .NET dependencies
        run: tools/ci/run-and-report.sh "Restore .NET dependencies" dotnet restore backend/api/Platform.slnx

      - name: Verify infrastructure definition
        run: tools/ci/run-and-report.sh "Verify infrastructure definition" pnpm infra:validate

      - name: Verify generated API client
        run: tools/ci/run-and-report.sh "Verify generated API client" pnpm api:check-drift

      - name: Lint
        run: tools/ci/run-and-report.sh "Lint" pnpm lint

      - name: Type check
        run: tools/ci/run-and-report.sh "Type check" pnpm typecheck

      - name: Test
        run: tools/ci/run-and-report.sh "Test" pnpm test

      - name: Build
        run: tools/ci/run-and-report.sh "Build" pnpm build
