name: CI

on:
  push:
    branches:
      - feat/overseas-community-platform-bootstrap
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: tools/ci/run-and-report.sh "Install JavaScript dependencies" pnpm install --frozen-lockfile

      - name: Restore .NET dependencies
        run: tools/ci/run-and-report.sh "Restore .NET dependencies" dotnet restore backend/api/Platform.slnx

      - name: Verify infrastructure definition
        run: tools/ci/run-and-report.sh "Verify infrastructure definition" pnpm infra:validate

      - name: Verify generated API client
        run: tools/ci/run-and-report.sh "Verify generated API client" pnpm api:check-drift

      - name: Lint
        run: tools/ci/run-and-report.sh "Lint" pnpm lint

      - name: Type check
        run: tools/ci/run-and-report.sh "Type check" pnpm typecheck

      - name: Test
        run: tools/ci/run-and-report.sh "Test" pnpm test

      - name: Build
        run: tools/ci/run-and-report.sh "Build" pnpm build
